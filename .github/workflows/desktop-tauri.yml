# Builds the Tauri version of the desktop app (desktop-tauri/, a spike) on each OS
# and, on Linux, installs it and runs it. Installers are uploaded as artifacts;
# nothing is published. See desktop-tauri/README.md.
name: Desktop (Tauri)

on:
  pull_request:
    paths:
      - 'desktop-tauri/**'
      - 'desktop/database.js'
      - 'desktop/ui/**'
      - 'desktop/prepare-server.mjs'
      - '.github/workflows/desktop-tauri.yml'
  push:
    branches: [main]
    paths:
      - 'desktop-tauri/**'
      - '.github/workflows/desktop-tauri.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Install Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xvfb

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Next.js standalone server that the app bundles (also what the Electron app uses).
      - name: Build the DevOne server
        run: node desktop/prepare-server.mjs

      - name: Install the Tauri CLI
        working-directory: desktop-tauri
        run: npm ci

      # PREPARE_RUNTIME bundles Node, the supervisor, Postgres and the server next to the shell.
      - name: Build the app
        working-directory: desktop-tauri
        env:
          PREPARE_RUNTIME: '1'
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-tauri-${{ matrix.os }}
          path: desktop-tauri/src-tauri/target/release/bundle/${{ matrix.bundles }}/*
          if-no-files-found: error

      # Linux: install the package and run it. PostgreSQL won't run as root, and the
      # runner user isn't root.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i desktop-tauri/src-tauri/target/release/bundle/deb/*.deb || sudo apt-get install -f -y
          xvfb-run -a ./desktop-tauri/smoke-test.sh
