name: Desktop

# Builds the Electron desktop app (docs/desktop.md) for macOS, Windows and Linux.
# A push to main whose package.json version has no v<version> tag yet publishes
# the installers as the GitHub Release v<version>. Bump "version" in the root
# package.json to ship a new desktop build. Pull requests that touch the desktop
# app build it for Linux only, to catch breakage early. Every run also starts the
# app's embedded PostgreSQL and applies the migrations on all three platforms.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - desktop/**
      - prisma/migrations/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; bump the version in package.json to ship a new build."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  database:
    name: Database smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: node desktop/smoke-test.cjs

  build:
    name: Build (${{ matrix.os }})
    needs: [version, database]
    if: needs.version.outputs.release == 'true' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native modules (sharp, ssh2's bindings) are installed for the runner's
        # OS and CPU, so each platform builds on its own runner.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["macos-latest", "windows-latest", "ubuntu-latest"]') }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Installers are unsigned until signing certificates are added as secrets.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install rpmbuild for the .rpm package
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.deb
            desktop/dist/*.rpm

  release:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, database, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DevOne ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: installers/*
