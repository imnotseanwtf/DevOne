<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src file: 'unsafe-inline'; font-src file:; script-src 'unsafe-inline'"
    />
    <title>DevOne</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      body {
        display: grid;
        grid-template-rows: 1fr auto;
        padding: 44px 48px 40px;
      }
      .top {
        display: flex;
        align-items: flex-start;
      }
      .logo {
        position: relative;
        width: 52px;
        height: 52px;
      }
      .logo .mark {
        width: 52px;
        height: 52px;
        position: relative;
        animation: pop 700ms var(--ease) both;
      }
      /* The antenna ring: the app is alive and working. It stops once everything is up. */
      .logo::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 8%;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        border: 1.5px solid var(--accent);
        opacity: 0;
        animation: ping 2.4s var(--ease) 600ms infinite;
      }
      body.ready .logo::before {
        animation: none;
      }
      .bottom {
        display: grid;
        gap: 28px;
      }
      h1 {
        margin: 0;
        font-size: 64px;
        line-height: 1;
        letter-spacing: -0.045em;
        font-weight: 600;
        display: flex;
      }
      h1 span {
        display: inline-block;
        animation: rise 800ms var(--ease) both;
        animation-delay: calc(180ms + var(--i) * 55ms);
      }
      .log {
        list-style: none;
        margin: 0;
        padding: 0;
        width: min(360px, 100%);
        display: grid;
        gap: 6px;
        font-size: 12.5px;
      }
      .log li {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        opacity: 0.45;
        transition:
          opacity 300ms var(--ease),
          color 300ms var(--ease);
      }
      .log li .glyph {
        width: 14px;
        height: 14px;
        display: grid;
        place-items: center;
      }
      .log li .time {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      .log li.running {
        color: var(--text);
        opacity: 1;
      }
      .log li.done {
        opacity: 0.8;
      }
      .log li.done .glyph {
        color: var(--accent);
      }
      .log li.running .glyph::before {
        content: '_';
        color: var(--accent);
        font-weight: 700;
        animation: blink 900ms steps(1) infinite;
      }
      .log li.pending .glyph::before {
        content: '_';
      }
      .log li .glyph .ico {
        width: 14px;
        height: 14px;
      }
      .bar {
        position: fixed;
        left: 0;
        bottom: 0;
        height: 2px;
        width: 100%;
        background: var(--accent);
        transform-origin: left;
        transform: scaleX(0);
        transition: transform 900ms var(--ease);
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.82) translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
      @keyframes ping {
        0% {
          opacity: 0.7;
          transform: scale(0.6);
        }
        70%,
        100% {
          opacity: 0;
          transform: scale(4.2);
        }
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="logo">
        <svg class="mark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <rect width="64" height="64" rx="14" fill="#0a0a0a" />
          <g transform="translate(9.8 9.8) scale(1.85)" fill="#fafafa">
            <path
              fill-rule="evenodd"
              d="M6 7.7H11.3V5.027A1.5 1.5 0 1 1 12.7 5.027V7.7H18A3 3 0 0 1 21 10.7V12.6H22A.8 .8 0 0 1 22.8 13.4V16A.8 .8 0 0 1 22 16.8H21V18.7A3 3 0 0 1 18 21.7H6A3 3 0 0 1 3 18.7V16.8H2A.8 .8 0 0 1 1.2 16V13.4A.8 .8 0 0 1 2 12.6H3V10.7A3 3 0 0 1 6 7.7ZM7.198 12.762L8.998 14.262A0.7 0.7 0 0 1 8.998 15.338L7.198 16.838A0.7 0.7 0 0 1 6.302 15.762L7.457 14.8L6.302 13.838A0.7 0.7 0 0 1 7.198 12.762ZM11.983 13.304L13.283 12.504A0.7 0.7 0 0 1 14.35 13.1L14.35 16.3A0.7 0.7 0 0 1 12.95 16.3L12.95 14.353L12.717 14.496A0.7 0.7 0 0 1 11.983 13.304ZM15.85 15.6h1.2a0.7 0.7 0 0 1 0 1.4h-1.2a0.7 0.7 0 0 1 0 -1.4Z"
            />
          </g>
        </svg>
      </div>
    </div>
    <main class="bottom">
      <h1 aria-label="DevOne">
        <span style="--i: 0">D</span><span style="--i: 1">e</span><span style="--i: 2">v</span
        ><span style="--i: 3">O</span><span style="--i: 4">n</span><span style="--i: 5">e</span>
      </h1>
      <ul class="log mono" id="log" aria-live="polite"></ul>
    </main>
    <div class="bar" id="bar"></div>
    <script>
      const STAGES = [
        { id: 'database', label: 'Starting database' },
        { id: 'migrate', label: 'Applying migrations' },
        { id: 'server', label: 'Starting server' },
        { id: 'open', label: 'Opening workspace' }
      ];
      const CHECK = `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path stroke="none" d="M0 0h24v24H0z" fill="none" />
  <path d="M5 12l5 5l10 -10" />
</svg>`;
      const log = document.getElementById('log');
      const rows = new Map(
        STAGES.map((s) => {
          const li = document.createElement('li');
          li.className = 'pending';
          li.innerHTML =
            '<span class="glyph"></span><span class="label"></span><span class="time"></span>';
          li.querySelector('.label').textContent = s.label;
          log.append(li);
          return [s.id, li];
        })
      );
      const seen = new Map(); // id -> time the stage started

      function apply(message) {
        const index = STAGES.findIndex((s) => s.id === message.id);
        if (index < 0) return;
        seen.set(message.id, message.at);
        STAGES.forEach((stage, i) => {
          const li = rows.get(stage.id);
          if (i < index && !li.classList.contains('done')) finish(stage.id, message.at);
          if (i === index) {
            if (message.label) li.querySelector('.label').textContent = message.label;
            li.className = 'running';
            li.querySelector('.glyph').innerHTML = '';
          }
        });
        document.getElementById('bar').style.transform = `scaleX(${(index + 0.5) / STAGES.length})`;
      }

      function finish(id, at) {
        const li = rows.get(id);
        li.className = 'done';
        li.querySelector('.glyph').innerHTML = CHECK;
        const started = seen.get(id);
        if (started)
          li.querySelector('.time').textContent = ((at - started) / 1000).toFixed(1) + 's';
      }

      window.devoneSplash.getStages().then((all) => all.forEach(apply));
      window.devoneSplash.onStage(apply);
    </script>
  </body>
</html>
